</style>

<text x="28" y="42" class="title" text-anchor="start">MA4141-3-2</text><text x="28" y="72" class="small" text-anchor="start">長方形、正方形的周長</text><text x="28" y="100" class="small" text-anchor="start">長方形與上下兩個正方形拼成 8 × 4 長方形</text><rect x="180" y="165" width="110" height="110" rx="8" fill="#d0ebff" class="shapeLine"/><rect x="290" y="165" width="110" height="55" rx="8" fill="#fff3bf" class="shapeLine"/><rect x="290" y="220" width="110" height="55" rx="8" fill="#fff3bf" class="shapeLine"/><line x1="290" y1="165" x2="290" y2="275" class="thin"/><line x1="180" y1="285" x2="290" y2="285" class="dash"/><path d="M180,285 l8,-5 M180,285 l8,5 M290,285 l-8,-5 M290,285 l-8,5" class="dash"/><text x="235.0" y="309.0" class="dim" text-anchor="middle">4 公分</text><line x1="290" y1="285" x2="400" y2="285" class="dash"/><path d="M290,285 l8,-5 M290,285 l8,5 M400,285 l-8,-5 M400,285 l-8,5" class="dash"/><text x="345.0" y="309.0" class="dim" text-anchor="middle">4 公分</text><line x1="160" y1="165" x2="160" y2="275" class="dash"/><path d="M160,165 l8,-5 M160,165 l8,5 M160,275 l-8,-5 M160,275 l-8,5" class="dash"/><text x="160.0" y="210.0" class="dim" text-anchor="middle">8 公分</text><text x="28" y="360" class="formula" text-anchor="start">周長：8 × 4 = 32 公分</text>
</svg>