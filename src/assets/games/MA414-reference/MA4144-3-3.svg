<text x="28" y="42" class="title" text-anchor="start">MA4144-3-3</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大長方形 20×18，扣掉中間 6×18</text><rect x="170" y="135" width="380" height="190" rx="8" fill="#fff3bf" class="shapeLine"/><rect x="270" y="135" width="125" height="190" fill="#fffaf0" class="shapeLine"/><line x1="270" y1="135" x2="270" y2="325" class="thin"/><line x1="395" y1="135" x2="395" y2="325" class="thin"/><line x1="170" y1="340" x2="550" y2="340" class="dash"/><path d="M170,340 l8,-5 M170,340 l8,5 M550,340 l-8,-5 M550,340 l-8,5" class="dash"/><text x="360.0" y="330.0" class="dim" text-anchor="middle">18 公分</text><line x1="145" y1="135" x2="145" y2="325" class="dash"/><path d="M145,135 l8,-5 M145,135 l8,5 M145,325 l-8,-5 M145,325 l-8,5" class="dash"/><text x="145.0" y="220.0" class="dim" text-anchor="middle">20 公分</text><line x1="270" y1="120" x2="395" y2="120" class="dash"/><path d="M270,120 l8,-5 M270,120 l8,5 M395,120 l-8,-5 M395,120 l-8,5" class="dash"/><text x="332.5" y="110.0" class="dim" text-anchor="middle">6 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
</svg>