<text x="28" y="42" class="title" text-anchor="start">MA4144-1-1</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">拆成 2×2 正方形與 3×1 長方形</text><polygon points="170,160 290,160 290,220 410,220 410,280 170,280" fill="#d8ccf1" class="shapeLine"/><line x1="170" y1="295" x2="290" y2="295" class="dash"/><path d="M170,295 l8,-5 M170,295 l8,5 M290,295 l-8,-5 M290,295 l-8,5" class="dash"/><text x="230.0" y="285.0" class="dim" text-anchor="middle">2 公分</text><line x1="290" y1="205" x2="410" y2="205" class="dash"/><path d="M290,205 l8,-5 M290,205 l8,5 M410,205 l-8,-5 M410,205 l-8,5" class="dash"/><text x="350.0" y="195.0" class="dim" text-anchor="middle">3 公分</text><line x1="145" y1="160" x2="145" y2="280" class="dash"/><path d="M145,160 l8,-5 M145,160 l8,5 M145,280 l-8,-5 M145,280 l-8,5" class="dash"/><text x="145.0" y="210.0" class="dim" text-anchor="middle">2 公分</text><line x1="425" y1="220" x2="425" y2="280" class="dash"/><path d="M425,220 l8,-5 M425,220 l8,5 M425,280 l-8,-5 M425,280 l-8,5" class="dash"/><text x="425.0" y="240.0" class="dim" text-anchor="middle">1 公分</text>
