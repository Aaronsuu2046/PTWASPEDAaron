<text x="28" y="42" class="title" text-anchor="start">MA4144-1-2</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">拆成 6×6 正方形與 15×3 長方形</text><polygon points="220,130 340,130 340,70 400,70 400,330 340,330 340,250 220,250" fill="#d8ccf1" class="shapeLine"/><line x1="220" y1="115" x2="340" y2="115" class="dash"/><path d="M220,115 l8,-5 M220,115 l8,5 M340,115 l-8,-5 M340,115 l-8,5" class="dash"/><text x="280.0" y="105.0" class="dim" text-anchor="middle">6 公分</text><line x1="340" y1="340" x2="400" y2="340" class="dash"/><path d="M340,340 l8,-5 M340,340 l8,5 M400,340 l-8,-5 M400,340 l-8,5" class="dash"/><text x="370.0" y="330.0" class="dim" text-anchor="middle">3 公分</text><line x1="195" y1="130" x2="195" y2="250" class="dash"/><path d="M195,130 l8,-5 M195,130 l8,5 M195,250 l-8,-5 M195,250 l-8,5" class="dash"/><text x="195.0" y="180.0" class="dim" text-anchor="middle">6 公分</text><line x1="420" y1="70" x2="420" y2="330" class="dash"/><path d="M420,70 l8,-5 M420,70 l8,5 M420,330 l-8,-5 M420,330 l-8,5" class="dash"/><text x="420.0" y="190.0" class="dim" text-anchor="middle">15 公分</text>
