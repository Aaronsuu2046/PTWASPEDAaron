<text x="28" y="42" class="title" text-anchor="start">MA4144-2-2</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大正方形 20×20，扣掉 5×10 長方形</text><rect x="190" y="100" width="260" height="260" rx="8" fill="#dee2e6" class="shapeLine"/><rect x="250" y="190" width="70" height="140" fill="#fffaf0" class="shapeLine"/><line x1="190" y1="85" x2="450" y2="85" class="dash"/><path d="M190,85 l8,-5 M190,85 l8,5 M450,85 l-8,-5 M450,85 l-8,5" class="dash"/><text x="320.0" y="75.0" class="dim" text-anchor="middle">20 公分</text><line x1="165" y1="100" x2="165" y2="360" class="dash"/><path d="M165,100 l8,-5 M165,100 l8,5 M165,360 l-8,-5 M165,360 l-8,5" class="dash"/><text x="165.0" y="220.0" class="dim" text-anchor="middle">20 公分</text><line x1="250" y1="175" x2="320" y2="175" class="dash"/><path d="M250,175 l8,-5 M250,175 l8,5 M320,175 l-8,-5 M320,175 l-8,5" class="dash"/><text x="285.0" y="165.0" class="dim" text-anchor="middle">5 公分</text><line x1="230" y1="190" x2="230" y2="330" class="dash"/><path d="M230,190 l8,-5 M230,190 l8,5 M230,330 l-8,-5 M230,330 l-8,5" class="dash"/><text x="230.0" y="250.0" class="dim" text-anchor="middle">10 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
