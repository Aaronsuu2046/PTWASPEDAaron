<text x="28" y="42" class="title" text-anchor="start">MA4144-2-1</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大長方形 8×5，扣掉 3×3 正方形</text><rect x="170" y="140" width="320" height="200" rx="8" fill="#dee2e6" class="shapeLine"/><rect x="350" y="200" width="120" height="120" fill="#fffaf0" class="shapeLine"/><line x1="170" y1="125" x2="490" y2="125" class="dash"/><path d="M170,125 l8,-5 M170,125 l8,5 M490,125 l-8,-5 M490,125 l-8,5" class="dash"/><text x="330.0" y="115.0" class="dim" text-anchor="middle">8 公分</text><line x1="145" y1="140" x2="145" y2="340" class="dash"/><path d="M145,140 l8,-5 M145,140 l8,5 M145,340 l-8,-5 M145,340 l-8,5" class="dash"/><text x="145.0" y="230.0" class="dim" text-anchor="middle">5 公分</text><line x1="350" y1="185" x2="470" y2="185" class="dash"/><path d="M350,185 l8,-5 M350,185 l8,5 M470,185 l-8,-5 M470,185 l-8,5" class="dash"/><text x="410.0" y="175.0" class="dim" text-anchor="middle">3 公分</text><line x1="330" y1="200" x2="330" y2="320" class="dash"/><path d="M330,200 l8,-5 M330,200 l8,5 M330,320 l-8,-5 M330,320 l-8,5" class="dash"/><text x="330.0" y="250.0" class="dim" text-anchor="middle">3 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
</svg>