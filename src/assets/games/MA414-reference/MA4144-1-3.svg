<text x="28" y="42" class="title" text-anchor="start">MA4144-1-3</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">拆成 4×4 正方形與 5×9 長方形</text><polygon points="180,210 360,210 360,130 440,130 440,310 180,310" fill="#d8ccf1" class="shapeLine"/><line x1="180" y1="325" x2="360" y2="325" class="dash"/><path d="M180,325 l8,-5 M180,325 l8,5 M360,325 l-8,-5 M360,325 l-8,5" class="dash"/><text x="270.0" y="315.0" class="dim" text-anchor="middle">9 公分</text><line x1="360" y1="115" x2="440" y2="115" class="dash"/><path d="M360,115 l8,-5 M360,115 l8,5 M440,115 l-8,-5 M440,115 l-8,5" class="dash"/><text x="400.0" y="105.0" class="dim" text-anchor="middle">4 公分</text><line x1="155" y1="210" x2="155" y2="310" class="dash"/><path d="M155,210 l8,-5 M155,210 l8,5 M155,310 l-8,-5 M155,310 l-8,5" class="dash"/><text x="155.0" y="250.0" class="dim" text-anchor="middle">5 公分</text><line x1="455" y1="130" x2="455" y2="210" class="dash"/><path d="M455,130 l8,-5 M455,130 l8,5 M455,210 l-8,-5 M455,210 l-8,5" class="dash"/><text x="455.0" y="160.0" class="dim" text-anchor="middle">4 公分</text>
