<text x="28" y="42" class="title" text-anchor="start">MA4144-3-4</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大長方形 15×9，扣掉橫向 15×2</text><rect x="165" y="120" width="390" height="230" rx="8" fill="#ffe8cc" class="shapeLine"/><rect x="165" y="180" width="390" height="55" fill="#fffaf0" class="shapeLine"/><line x1="165" y1="180" x2="165" y2="235" class="thin"/><line x1="555" y1="180" x2="555" y2="235" class="thin"/><line x1="165" y1="105" x2="555" y2="105" class="dash"/><path d="M165,105 l8,-5 M165,105 l8,5 M555,105 l-8,-5 M555,105 l-8,5" class="dash"/><text x="360.0" y="95.0" class="dim" text-anchor="middle">15 公分</text><line x1="140" y1="120" x2="140" y2="350" class="dash"/><path d="M140,120 l8,-5 M140,120 l8,5 M140,350 l-8,-5 M140,350 l-8,5" class="dash"/><text x="140.0" y="225.0" class="dim" text-anchor="middle">9 公分</text><line x1="565" y1="180" x2="565" y2="235" class="dash"/><path d="M565,180 l8,-5 M565,180 l8,5 M565,235 l-8,-5 M565,235 l-8,5" class="dash"/><text x="565.0" y="197.5" class="dim" text-anchor="middle">2 公分</text><line x1="565" y1="120" x2="565" y2="180" class="dash"/><path d="M565,120 l8,-5 M565,120 l8,5 M565,180 l-8,-5 M565,180 l-8,5" class="dash"/><text x="565.0" y="140.0" class="dim" text-anchor="middle">3 公分</text><line x1="565" y1="235" x2="565" y2="350" class="dash"/><path d="M565,235 l8,-5 M565,235 l8,5 M565,350 l-8,-5 M565,350 l-8,5" class="dash"/><text x="565.0" y="282.5" class="dim" text-anchor="middle">4 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
