<text x="28" y="42" class="title" text-anchor="start">MA4144-2-3</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大正方形 12×12，扣掉 4×8 長方形</text><rect x="190" y="120" width="280" height="220" rx="8" fill="#d0ebff" class="shapeLine"/><rect x="285" y="165" width="80" height="150" fill="#fffaf0" class="shapeLine"/><line x1="190" y1="105" x2="470" y2="105" class="dash"/><path d="M190,105 l8,-5 M190,105 l8,5 M470,105 l-8,-5 M470,105 l-8,5" class="dash"/><text x="330.0" y="95.0" class="dim" text-anchor="middle">12 公分</text><line x1="165" y1="120" x2="165" y2="340" class="dash"/><path d="M165,120 l8,-5 M165,120 l8,5 M165,340 l-8,-5 M165,340 l-8,5" class="dash"/><text x="165.0" y="220.0" class="dim" text-anchor="middle">12 公分</text><line x1="285" y1="150" x2="365" y2="150" class="dash"/><path d="M285,150 l8,-5 M285,150 l8,5 M365,150 l-8,-5 M365,150 l-8,5" class="dash"/><text x="325.0" y="140.0" class="dim" text-anchor="middle">4 公分</text><line x1="370" y1="165" x2="370" y2="315" class="dash"/><path d="M370,165 l8,-5 M370,165 l8,5 M370,315 l-8,-5 M370,315 l-8,5" class="dash"/><text x="370.0" y="230.0" class="dim" text-anchor="middle">8 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
