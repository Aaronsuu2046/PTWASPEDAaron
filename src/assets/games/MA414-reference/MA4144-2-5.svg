<text x="28" y="42" class="title" text-anchor="start">MA4144-2-5</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大長方形 16×12，扣掉 4×4 正方形</text><rect x="190" y="100" width="260" height="260" rx="8" fill="#ffd8a8" class="shapeLine"/><rect x="300" y="285" width="70" height="55" fill="#fffaf0" class="shapeLine"/><line x1="190" y1="85" x2="450" y2="85" class="dash"/><path d="M190,85 l8,-5 M190,85 l8,5 M450,85 l-8,-5 M450,85 l-8,5" class="dash"/><text x="320.0" y="75.0" class="dim" text-anchor="middle">12 公分</text><line x1="165" y1="100" x2="165" y2="360" class="dash"/><path d="M165,100 l8,-5 M165,100 l8,5 M165,360 l-8,-5 M165,360 l-8,5" class="dash"/><text x="165.0" y="220.0" class="dim" text-anchor="middle">16 公分</text><line x1="300" y1="270" x2="370" y2="270" class="dash"/><path d="M300,270 l8,-5 M300,270 l8,5 M370,270 l-8,-5 M370,270 l-8,5" class="dash"/><text x="335.0" y="260.0" class="dim" text-anchor="middle">4 公分</text><line x1="280" y1="285" x2="280" y2="340" class="dash"/><path d="M280,285 l8,-5 M280,285 l8,5 M280,340 l-8,-5 M280,340 l-8,5" class="dash"/><text x="280.0" y="302.5" class="dim" text-anchor="middle">4 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
