<text x="28" y="42" class="title" text-anchor="start">MA4144-3-5</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大長方形 15×25，扣掉中間 15×4</text><rect x="155" y="135" width="410" height="190" rx="8" fill="#e9ecef" class="shapeLine"/><rect x="270" y="135" width="70" height="190" fill="#fffaf0" class="shapeLine"/><line x1="270" y1="135" x2="270" y2="325" class="thin"/><line x1="340" y1="135" x2="340" y2="325" class="thin"/><line x1="155" y1="340" x2="565" y2="340" class="dash"/><path d="M155,340 l8,-5 M155,340 l8,5 M565,340 l-8,-5 M565,340 l-8,5" class="dash"/><text x="360.0" y="330.0" class="dim" text-anchor="middle">25 公分</text><line x1="130" y1="135" x2="130" y2="325" class="dash"/><path d="M130,135 l8,-5 M130,135 l8,5 M130,325 l-8,-5 M130,325 l-8,5" class="dash"/><text x="130.0" y="220.0" class="dim" text-anchor="middle">15 公分</text><line x1="270" y1="120" x2="340" y2="120" class="dash"/><path d="M270,120 l8,-5 M270,120 l8,5 M340,120 l-8,-5 M340,120 l-8,5" class="dash"/><text x="305.0" y="110.0" class="dim" text-anchor="middle">4 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
</svg>