<text x="28" y="42" class="title" text-anchor="start">MA4144-3-2</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">大長方形 10×12，扣掉中間 5×10</text><rect x="180" y="120" width="360" height="220" rx="8" fill="#fff3bf" class="shapeLine"/><rect x="330" y="120" width="150" height="220" fill="#fffaf0" class="shapeLine"/><line x1="330" y1="120" x2="330" y2="340" class="thin"/><line x1="480" y1="120" x2="480" y2="340" class="thin"/><line x1="180" y1="355" x2="540" y2="355" class="dash"/><path d="M180,355 l8,-5 M180,355 l8,5 M540,355 l-8,-5 M540,355 l-8,5" class="dash"/><text x="360.0" y="345.0" class="dim" text-anchor="middle">12 公分</text><line x1="155" y1="120" x2="155" y2="340" class="dash"/><path d="M155,120 l8,-5 M155,120 l8,5 M155,340 l-8,-5 M155,340 l-8,5" class="dash"/><text x="155.0" y="220.0" class="dim" text-anchor="middle">10 公分</text><line x1="330" y1="105" x2="480" y2="105" class="dash"/><path d="M330,105 l8,-5 M330,105 l8,5 M480,105 l-8,-5 M480,105 l-8,5" class="dash"/><text x="405.0" y="95.0" class="dim" text-anchor="middle">5 公分</text><text x="28" y="378" class="formula" text-anchor="start">白色區域為扣除部分。</text>
</svg>