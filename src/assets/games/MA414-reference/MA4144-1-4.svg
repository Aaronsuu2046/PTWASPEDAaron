<text x="28" y="42" class="title" text-anchor="start">MA4144-1-4</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">拆成 6×6 正方形與 4×12 長方形</text><polygon points="180,200 300,200 300,80 380,80 380,320 180,320" fill="#d8ccf1" class="shapeLine"/><line x1="180" y1="185" x2="300" y2="185" class="dash"/><path d="M180,185 l8,-5 M180,185 l8,5 M300,185 l-8,-5 M300,185 l-8,5" class="dash"/><text x="240.0" y="175.0" class="dim" text-anchor="middle">6 公分</text><line x1="300" y1="65" x2="380" y2="65" class="dash"/><path d="M300,65 l8,-5 M300,65 l8,5 M380,65 l-8,-5 M380,65 l-8,5" class="dash"/><text x="340.0" y="55.0" class="dim" text-anchor="middle">4 公分</text><line x1="155" y1="200" x2="155" y2="320" class="dash"/><path d="M155,200 l8,-5 M155,200 l8,5 M155,320 l-8,-5 M155,320 l-8,5" class="dash"/><text x="155.0" y="250.0" class="dim" text-anchor="middle">6 公分</text><line x1="395" y1="80" x2="395" y2="320" class="dash"/><path d="M395,80 l8,-5 M395,80 l8,5 M395,320 l-8,-5 M395,320 l-8,5" class="dash"/><text x="395.0" y="190.0" class="dim" text-anchor="middle">12 公分</text>
