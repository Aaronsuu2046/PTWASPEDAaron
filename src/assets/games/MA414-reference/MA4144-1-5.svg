<text x="28" y="42" class="title" text-anchor="start">MA4144-1-5</text><text x="28" y="72" class="small" text-anchor="start">複合圖形的面積</text><text x="28" y="100" class="small" text-anchor="start">拆成 6×6 正方形與 5×16 長方形</text><polygon points="160,230 480,230 480,290 340,290 340,170 220,170 220,230" fill="#d8ccf1" class="shapeLine"/><line x1="160" y1="305" x2="480" y2="305" class="dash"/><path d="M160,305 l8,-5 M160,305 l8,5 M480,305 l-8,-5 M480,305 l-8,5" class="dash"/><text x="320.0" y="295.0" class="dim" text-anchor="middle">16 公分</text><line x1="220" y1="155" x2="340" y2="155" class="dash"/><path d="M220,155 l8,-5 M220,155 l8,5 M340,155 l-8,-5 M340,155 l-8,5" class="dash"/><text x="280.0" y="145.0" class="dim" text-anchor="middle">6 公分</text><line x1="135" y1="230" x2="135" y2="290" class="dash"/><path d="M135,230 l8,-5 M135,230 l8,5 M135,290 l-8,-5 M135,290 l-8,5" class="dash"/><text x="135.0" y="250.0" class="dim" text-anchor="middle">5 公分</text><line x1="350" y1="170" x2="350" y2="230" class="dash"/><path d="M350,170 l8,-5 M350,170 l8,5 M350,230 l-8,-5 M350,230 l-8,5" class="dash"/><text x="350.0" y="190.0" class="dim" text-anchor="middle">6 公分</text>
